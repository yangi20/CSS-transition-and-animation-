<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .circle{
        background-color: aqua;
        height: 100px;
        width: 100px;
        border-radius: 50%;
        border: 30px solid lightgray;
    }
    .liquid{
        background-color: blue;
        height: 30px;
        width: 30px;
        border-radius: 50%;
        transition: all 2s;
    }
    .liquid:hover{
        cursor: pointer;
        transform: rotate(360deg);
    }
    </style>
</head>
<body>
    <div class="circle">
        <div class="liquid">
            <h4>7</h4>
        </div>
    </div>
</body>
</html>
