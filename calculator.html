<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 600px;
            /* background-color: lightgray; */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .box{
            height: 470px;
            width: 350px;
            background-color: lightgray;
            border-radius: 30px;
        }
        .inside{
            background-color: lightgray;
            margin: 25px;
            height: 425px;
        }
        .top{
            background-color: lightgray;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .solar{
            background-color: white;
            height: 25px;
            width: 50px;
            border-radius: 25px;
            box-shadow: inset 1px 1px 2px gray;
        }
        .circle{
            background-color: rgb(82, 82, 240);
            height: 25px;
            width: 25px;
            border-radius: 50%;
            box-shadow: 1px 1px 3px;
        }
        .display{
            background-color: white;
            height: 70px;
            margin-top: 0px;
            border-radius: 15px;
            display: flex;
            justify-content: end;
            box-shadow: inset 2px 2px 4px gray;
        }
        .display h2{
            margin-top: 40px;
            margin-right: 10px;
        }
        .buttons{
            /* background-color: cadetblue; */
            height: 230px;
            display: flex;
            gap: 5px;
            flex-direction: column;
            margin-top: 10px;
        }
        .btns{
            /* background-color: aquamarine; */
            display: flex;
            /* gap: 5px; */
            justify-content: space-between;
        }
        .btn{
            background-color: white;
            height: 50px;
            width: 60px;
            border-radius: 10px;
            margin: 3px;
            text-align: center;
            box-shadow: 3px 3px 4px gray;
        }
        #largeBtn{
            width: 135px;
        }
        .sign{
            color: rgb(42, 42, 232);
            
        }
        .equalTo{
            background-color: rgb(50, 50, 219);
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            <div class="inside">
                <div class="top">
                    <p>NORMAL MODE</p>
                    <div class="solar">
                        <div class="circle"></div>
                    </div>
                </div>
                <div class="display">
                    <h2>0</h2>
                </div>
                <div class="buttons">
                    <div class="btns">
                        <div class="btn sign"><h3>AC</h3></div>
                        <div class="btn sign"><h3>+/-</h3></div>
                        <div class="btn sign"><h3>%</h3></div>
                        <div class="btn sign"><h3>/</h3></div>
                    </div>
                    <div class="btns">
                        <div class="btn"><h3>7</h3></div>
                        <div class="btn"><h3>8</h3></div>
                        <div class="btn"><h3>9</h3></div>
                        <div class="btn sign"><h3>*</h3></div>
                    </div>
                    <div class="btns">
                        <div class="btn"><h3>4</h3></div>
                        <div class="btn"><h3>5</h3></div>
                        <div class="btn"><h3>6</h3></div>
                        <div class="btn sign"><h3>-</h3></div>
                    </div>
                    <div class="btns">
                        <div class="btn"><h3>1</h3></div>
                        <div class="btn"><h3>2</h3></div>
                        <div class="btn"><h3>3</h3></div>
                        <div class="btn sign"><h3>+</h3></div>
                    </div>
                    <div class="btns">
                        <div class="btn" id="largeBtn"><h3>0</h3></div>
                        <div class="btn"><h3>.</h3></div>
                        <div class="btn sign equalTo"><h3>=</h3></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
